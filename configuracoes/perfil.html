<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil do Usuário — SGCS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#002451",
            "primary-container": "#0e3a73",
            secondary: "#346092",
            "secondary-container": "#9cc7fe",
            background: "#f8f9ff",
            surface: "#f8f9ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eff4ff",
            "surface-container": "#e5eeff",
            "surface-container-high": "#dce9ff",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#434750",
            outline: "#737781",
            "outline-variant": "#c3c6d1",
            error: "#ba1a1a"
          },
          fontFamily: {
            poppins: ["Poppins", "sans-serif"],
            sans: ["Open Sans", "sans-serif"]
          },
          spacing: {
            'space-xs': '0.5rem',
            'space-sm': '0.75rem',
            'space-md': '1rem',
            'space-lg': '1.25rem',
            'space-xl': '1.5rem',
            'space-2xl': '2rem',
            'margin-desktop': '2rem',
            'gutter-desktop': '1.5rem'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/assets/css/app.css"/>
</head>
<body class="bg-background font-sans text-on-surface antialiased">

  <div id="app-sidebar"></div>

  <div class="pl-64 flex flex-col min-h-screen">
    <div id="app-header"></div>

    <main class="w-full pt-16 bg-background flex-1 px-gutter-desktop py-space-xl">
      <div class="flex flex-col w-full max-w-3xl mx-auto gap-6">

        <div>
          <h1 class="font-poppins font-bold text-2xl text-primary tracking-tight">Perfil do Síndico</h1>
          <p class="text-sm text-on-surface-variant mt-0.5">Gerencie suas informações pessoais e credenciais de acesso.</p>
        </div>

        <form id="form-perfil" class="bg-surface-container-lowest p-8 rounded-xl shadow-sm border border-outline-variant/30 flex flex-col gap-6">

          <div class="flex items-center gap-4 border-b border-outline-variant/20 pb-6">
            <div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center text-white text-2xl font-bold shadow-md">
              <span class="material-symbols-outlined text-[36px]">person</span>
            </div>
            <div class="flex flex-col">
              <h2 id="profile-display-name" class="font-poppins font-bold text-lg text-primary">Síndico General</h2>
              <span id="profile-display-email" class="text-xs text-on-surface-variant">sindico@email.com</span>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex flex-col gap-1.5">
              <label for="profile-name" class="text-xs font-semibold uppercase tracking-wider text-on-surface">Nome Completo *</label>
              <input type="text" id="profile-name" required class="w-full h-10 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 focus:border-secondary"/>
            </div>

            <div class="flex flex-col gap-1.5">
              <label for="profile-phone" class="text-xs font-semibold uppercase tracking-wider text-on-surface">Telefone de Contato</label>
              <input type="tel" id="profile-phone" placeholder="(11) 99999-9999" class="w-full h-10 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 focus:border-secondary"/>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="profile-email" class="text-xs font-semibold uppercase tracking-wider text-on-surface">E-mail (Leitura)</label>
            <input type="email" id="profile-email" readonly class="w-full h-10 px-3 bg-surface-container-high/50 text-on-surface-variant text-sm rounded outline-none border border-outline-variant/30 cursor-not-allowed"/>
          </div>

          <div class="flex justify-end pt-4 border-t border-outline-variant/20">
            <button type="submit" id="btn-save-profile" class="px-6 py-2.5 rounded font-poppins font-semibold text-sm bg-primary hover:bg-primary-container text-white shadow-sm transition-colors flex items-center gap-2">
              <span class="material-symbols-outlined text-[18px]">save</span>
              <span>Salvar Perfil</span>
            </button>
          </div>

        </form>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>

  <script type="module">
    import { requireAuth, getCurrentUserProfile } from '/assets/js/auth.js';
    import { initLayout } from '/assets/js/layout.js';
    import { showToast, showLoader, hideLoader } from '/assets/js/ui.js';
    import { supabase } from '/assets/js/supabase.js';

    async function loadProfile() {
      showLoader();
      try {
        const profile = await getCurrentUserProfile();
        if (profile) {
          document.getElementById('profile-display-name').textContent = profile.nome_completo || 'Síndico';
          document.getElementById('profile-display-email').textContent = profile.email || '';
          document.getElementById('profile-name').value = profile.nome_completo || '';
          document.getElementById('profile-phone').value = profile.telefone || '';
          document.getElementById('profile-email').value = profile.email || '';
        }
      } catch (err) {
        showToast('Erro ao carregar dados do perfil', 'error');
      } finally {
        hideLoader();
      }
    }

    document.getElementById('form-perfil').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome_completo = document.getElementById('profile-name').value.trim();
      const telefone = document.getElementById('profile-phone').value.trim();

      if (!nome_completo) {
        showToast('Informe o seu nome completo', 'error');
        return;
      }

      showLoader();
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('Sessão expirada');

        const { error } = await supabase
          .from('profiles')
          .update({
            nome_completo,
            telefone,
            updated_at: new Date()
          })
          .eq('id', session.user.id);

        if (error) throw error;

        showToast('Perfil atualizado com sucesso!');
        await initLayout('perfil', 'Perfil do Usuário');
        loadProfile();
      } catch (err) {
        showToast(err.message || 'Erro ao atualizar perfil', 'error');
      } finally {
        hideLoader();
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      await requireAuth();
      await initLayout('perfil', 'Perfil do Usuário');
      loadProfile();
    });
  </script>
</body>
</html>
