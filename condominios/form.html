<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Condomínio - SGCS</title>
  <link href="../assets/css/app.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm",
      "alpinejs": "https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/module.esm.js"
    }
  }
  </script>
  <script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "inverse-on-surface": "#eaf1ff", "error-container": "#ffdad6", "primary": "#002451", "secondary": "#346092", "surface-container-highest": "#d3e4fe", "secondary-fixed": "#d2e4ff", "on-secondary": "#ffffff", "on-tertiary-container": "#4caee8", "on-tertiary-fixed-variant": "#004c6e", "surface-container": "#e5eeff", "inverse-surface": "#213145", "on-error": "#ffffff", "secondary-container": "#9cc7fe", "tertiary-fixed": "#c8e6ff", "primary-container": "#0e3a73", "secondary-fixed-dim": "#a1c9ff", "tertiary-container": "#003f5c", "surface-container-lowest": "#ffffff", "surface-variant": "#d3e4fe", "inverse-primary": "#abc7ff", "on-surface-variant": "#434750", "surface-dim": "#cbdbf5", "tertiary-fixed-dim": "#88ceff", "surface-container-low": "#eff4ff", "surface-container-high": "#dce9ff", "on-tertiary-fixed": "#001e2f", "error": "#ba1a1a", "surface-tint": "#3a5e99", "background": "#f8f9ff", "on-background": "#0b1c30", "surface": "#f8f9ff", "primary-fixed": "#d7e3ff", "on-error-container": "#93000a", "primary-fixed-dim": "#abc7ff", "on-surface": "#0b1c30", "on-primary-container": "#83a6e5", "outline": "#737781", "outline-variant": "#c3c6d1", "on-secondary-fixed": "#001c37", "on-tertiary": "#ffffff", "surface-bright": "#f8f9ff", "on-secondary-container": "#245283", "on-primary-fixed-variant": "#1f4680", "on-secondary-fixed-variant": "#164879", "on-primary-fixed": "#001b3f", "on-primary": "#ffffff", "tertiary": "#00283d" } } } };
  </script>
</head>
<body class="bg-background font-body-md text-on-surface antialiased">
  <div id="app-wrapper">
    <main class="flex-1 pl-64 pt-16 w-full">
      <div class="px-gutter-desktop py-space-xl flex flex-col w-full max-w-4xl mx-auto gap-space-lg" x-data="condominioForm()">

        <div class="flex items-center gap-space-md mb-space-md">
          <button onclick="window.history.back()" class="w-8 h-8 rounded hover:bg-surface-container flex items-center justify-center transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
          </button>
          <h1 class="font-headline-lg text-primary tracking-tight" x-text="isEdit ? 'Editar Condomínio' : 'Novo Condomínio'"></h1>
        </div>

        <form @submit.prevent="save" class="bg-surface-container-lowest p-space-xl rounded shadow-sm border border-outline/20 flex flex-col gap-space-lg">

          <div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
            <div class="flex flex-col gap-space-2xs">
              <label class="font-label-md text-on-surface-variant">Nome do Condomínio *</label>
              <input type="text" x-model="form.nome" required class="h-10 px-space-sm bg-surface-container-low border border-outline/40 rounded focus:ring-1 focus:ring-primary outline-none">
            </div>

            <div class="flex flex-col gap-space-2xs">
              <label class="font-label-md text-on-surface-variant">CNPJ</label>
              <input type="text" x-model="form.cnpj" class="h-10 px-space-sm bg-surface-container-low border border-outline/40 rounded focus:ring-1 focus:ring-primary outline-none" placeholder="00.000.000/0000-00">
            </div>
          </div>

          <div class="flex flex-col gap-space-2xs">
            <label class="font-label-md text-on-surface-variant">Endereço Completo</label>
            <input type="text" x-model="form.endereco_completo" required class="h-10 px-space-sm bg-surface-container-low border border-outline/40 rounded focus:ring-1 focus:ring-primary outline-none">
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
            <div class="flex flex-col gap-space-2xs">
              <label class="font-label-md text-on-surface-variant">Quantidade de Unidades</label>
              <input type="number" x-model.number="form.quantidade_unidades" required min="1" class="h-10 px-space-sm bg-surface-container-low border border-outline/40 rounded focus:ring-1 focus:ring-primary outline-none">
            </div>

            <div class="flex flex-col gap-space-2xs justify-end h-full py-2">
              <label class="flex items-center gap-space-xs cursor-pointer">
                <input type="checkbox" x-model="form.ativo" class="w-4 h-4 rounded text-primary focus:ring-primary">
                <span class="font-label-md text-on-surface">Condomínio Ativo</span>
              </label>
            </div>
          </div>

          <div class="flex justify-end gap-space-sm pt-space-md border-t border-outline/10">
            <button type="button" onclick="window.history.back()" class="px-space-md h-10 rounded border border-outline/40 text-on-surface hover:bg-surface-container transition-colors font-label-md">Cancelar</button>
            <button type="submit" :disabled="saving" class="px-space-md h-10 rounded bg-primary text-on-primary hover:bg-primary/90 transition-colors font-label-md flex items-center gap-2">
              <span x-text="saving ? 'Salvando...' : 'Salvar'"></span>
            </button>
          </div>
        </form>

      </div>
    </main>
  </div>

  <script type="module">
    import { ui } from '../assets/js/ui.js';
    import { supabase } from '../assets/js/supabase.js';
    import Alpine from 'alpinejs';
    window.Alpine = Alpine;

    document.addEventListener('alpine:init', () => {
      window.Alpine.data('condominioForm', () => ({
        isEdit: false,
        saving: false,
        id: null,
        form: {
          nome: '',
          cnpj: '',
          endereco_completo: '',
          quantidade_unidades: 1,
          ativo: true
        },

        async init() {
          const urlParams = new URLSearchParams(window.location.search);
          this.id = urlParams.get('id');
          if (this.id) {
            this.isEdit = true;
            try {
              const { data, error } = await supabase.from('condominios').select('*').eq('id', this.id).single();
              if (error) throw error;
              if (data) {
                this.form = {
                  nome: data.nome,
                  cnpj: data.cnpj || '',
                  endereco_completo: data.endereco_completo || '',
                  quantidade_unidades: data.quantidade_unidades || 1,
                  ativo: data.ativo !== false
                };
              }
            } catch(e) { console.error('Error fetching', e); }
          }
        },

        async save() {
          this.saving = true;
          try {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) throw new Error('Não autenticado');

            const payload = { ...this.form, sindico_id: session.user.id };

            if (this.isEdit) {
              await supabase.from('condominios').update(payload).eq('id', this.id);
            } else {
              await supabase.from('condominios').insert([payload]);
            }
            window.location.href = 'index.html';
          } catch(e) {
            console.error('Error saving', e);
            alert('Erro ao salvar condomínio');
          } finally {
            this.saving = false;
          }
        }
      }));
    });

    Alpine.start();

    document.addEventListener('DOMContentLoaded', async () => {
      await ui.renderLayout('condominios', [{label: 'Condomínios', active: false}, {label: 'Formulário', active: true}], '/GESTAO-DE-PROJETOS---SGCS/' );
    });
  </script>
</body>
</html>
