<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SGCS Gestão Predial</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

  <!-- Notyf CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#002451",
            "primary-container": "#0e3a73",
            secondary: "#346092",
            "secondary-container": "#9cc7fe",
            background: "#f8f9ff",
            surface: "#f8f9ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eff4ff",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#434750",
            outline: "#737781",
            "outline-variant": "#c3c6d1",
            error: "#ba1a1a"
          },
          fontFamily: {
            poppins: ["Poppins", "sans-serif"],
            sans: ["Open Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="./assets/css/app.css"/>
</head>
<body class="bg-background font-sans text-on-surface antialiased min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/30 p-8 flex flex-col gap-6">
    <!-- Header Logo -->
    <div class="flex flex-col items-center text-center gap-2">
      <div class="w-12 h-12 rounded-lg bg-primary flex items-center justify-center text-white shadow-md">
        <span class="material-symbols-outlined text-[28px]">apartment</span>
      </div>
      <div>
        <h1 class="font-poppins font-bold text-2xl text-primary tracking-tight">SGCS</h1>
        <p class="font-sans text-xs text-secondary font-semibold uppercase tracking-wider">Gestão Predial para Síndicos</p>
      </div>
    </div>

    <!-- Form -->
    <form id="login-form" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-xs font-semibold uppercase tracking-wider text-on-surface">E-mail Corporativo</label>
        <div class="relative flex items-center">
          <input type="email" id="email" required placeholder="sindico@exemplo.com" class="w-full h-10 px-3 bg-surface-container-low text-on-surface rounded border border-outline-variant/50 focus:outline-none focus:border-secondary transition-colors text-sm"/>
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label for="password" class="text-xs font-semibold uppercase tracking-wider text-on-surface">Senha</label>
        </div>
        <div class="relative flex items-center">
          <input type="password" id="password" required minlength="6" placeholder="******" class="w-full h-10 px-3 bg-surface-container-low text-on-surface rounded border border-outline-variant/50 focus:outline-none focus:border-secondary transition-colors text-sm"/>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="w-full h-10 mt-2 bg-primary hover:bg-primary-container text-white font-poppins font-semibold text-sm rounded shadow transition-all duration-150 flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[18px]">login</span>
        <span>Entrar no Sistema</span>
      </button>
    </form>

    <div class="text-center border-t border-outline-variant/30 pt-4">
      <p class="text-xs text-on-surface-variant">SGCS v2.4 • Sistema de Gerenciamento de Chamados</p>
    </div>
  </div>

  <!-- Notyf Script -->
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>

  <script type="module">
    import { signIn } from './assets/js/auth.js';
    import { showToast } from './assets/js/ui.js';

    const loginForm = document.getElementById('login-form');
    const btnSubmit = document.getElementById('btn-submit');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btnSubmit.disabled = true;
      btnSubmit.classList.add('opacity-70');

      try {
        await signIn(email, password);
        showToast('Login realizado com sucesso!', 'success');
        setTimeout(() => {
          window.location.href = './dashboard.html';
        }, 800);
      } catch (err) {
        showToast(err.message || 'Erro ao realizar login. Verifique suas credenciais.', 'error');
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('opacity-70');
      }
    });
  </script>
</body>
</html>
