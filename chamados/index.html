<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestão de Chamados — SGCS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#002451",
            "primary-container": "#0e3a73",
            secondary: "#346092",
            "secondary-container": "#9cc7fe",
            "secondary-fixed": "#d2e4ff",
            background: "#f8f9ff",
            surface: "#f8f9ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eff4ff",
            "surface-container": "#e5eeff",
            "surface-container-high": "#dce9ff",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#434750",
            outline: "#737781",
            "outline-variant": "#c3c6d1",
            error: "#ba1a1a"
          },
          fontFamily: {
            poppins: ["Poppins", "sans-serif"],
            sans: ["Open Sans", "sans-serif"]
          },
          spacing: {
            'space-xs': '0.5rem',
            'space-sm': '0.75rem',
            'space-md': '1rem',
            'space-lg': '1.25rem',
            'space-xl': '1.5rem',
            'space-2xl': '2rem',
            'margin-desktop': '2rem',
            'gutter-desktop': '1.5rem'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/assets/css/app.css"/>
</head>
<body class="bg-background font-sans text-on-surface antialiased">

  <div id="app-sidebar"></div>

  <div class="pl-64 flex flex-col min-h-screen">
    <div id="app-header"></div>

    <main class="w-full pt-16 bg-background flex-1 px-gutter-desktop py-space-xl">
      <div class="flex flex-col w-full gap-6">

        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <h1 class="font-poppins font-bold text-2xl text-primary tracking-tight">Gestão de Chamados</h1>
            <p class="text-sm text-on-surface-variant mt-0.5">Centralize e acompanhe solicitações de todos os condomínios em tempo real.</p>
          </div>
          <a href="/chamados/novo.html" class="flex items-center gap-2 bg-primary hover:bg-primary-container text-white px-4 py-2 rounded font-poppins font-semibold text-sm shadow-sm transition-colors cursor-pointer self-start md:self-auto">
            <span class="material-symbols-outlined text-[18px]">add</span>
            <span>Novo Chamado</span>
          </a>
        </div>

        <!-- Filters Bar -->
        <div class="bg-surface-container-lowest rounded-lg p-4 shadow-sm border border-outline-variant/30 flex flex-col gap-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
            <div class="relative col-span-1 sm:col-span-2 lg:col-span-1">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[18px]">search</span>
              <input type="text" id="filter-search" placeholder="Buscar por título ou morador..." class="w-full h-9 pl-9 pr-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 focus:border-secondary"/>
            </div>

            <select id="filter-condominio" class="h-9 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 cursor-pointer">
              <option value="">Condomínio: Todos</option>
            </select>

            <select id="filter-status" class="h-9 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 cursor-pointer">
              <option value="">Status: Todos</option>
              <option value="aberto">Aberto</option>
              <option value="em_andamento">Em Andamento</option>
              <option value="aguardando">Aguardando</option>
              <option value="resolvido">Resolvido</option>
              <option value="cancelado">Cancelado</option>
            </select>

            <select id="filter-prioridade" class="h-9 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 cursor-pointer">
              <option value="">Prioridade: Todas</option>
              <option value="urgente">Crítica / Urgente</option>
              <option value="alta">Alta</option>
              <option value="media">Média</option>
              <option value="baixa">Baixa</option>
            </select>

            <select id="filter-tipo" class="h-9 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 cursor-pointer">
              <option value="">Tipo: Todos</option>
            </select>
          </div>
        </div>

        <!-- Chamados Table -->
        <div class="bg-surface-container-lowest rounded-lg shadow-sm border border-outline-variant/30 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-surface-container-low text-on-surface-variant border-b border-outline-variant/20">
                  <th class="py-3 px-4 text-xs font-bold uppercase tracking-wider">Protocolo</th>
                  <th class="py-3 px-4 text-xs font-bold uppercase tracking-wider">Título & Solicitação</th>
                  <th class="py-3 px-4 text-xs font-bold uppercase tracking-wider">Condomínio / Local</th>
                  <th class="py-3 px-4 text-xs font-bold uppercase tracking-wider">Solicitante</th>
                  <th class="py-3 px-4 text-xs font-bold uppercase tracking-wider">Categoria</th>
                  <th class="py-3 px-4 text-xs font-bold uppercase tracking-wider">Prioridade</th>
                  <th class="py-3 px-4 text-xs font-bold uppercase tracking-wider">Status</th>
                  <th class="py-3 px-4 text-xs font-bold uppercase tracking-wider text-right">Ações</th>
                </tr>
              </thead>
              <tbody id="chamados-tbody" class="divide-y divide-outline-variant/20 text-sm">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>

  <script type="module">
    import { requireAuth } from '/assets/js/auth.js';
    import { initLayout } from '/assets/js/layout.js';
    import { showToast, showLoader, hideLoader, statusBadge, priorityBadge } from '/assets/js/ui.js';
    import { getChamados } from '/assets/js/chamados-service.js';
    import { getCondominios } from '/assets/js/condominios-service.js';
    import { getTiposChamado } from '/assets/js/tipos-service.js';

    let chamadosList = [];

    async function initFilters() {
      const condominios = await getCondominios();
      const selectCondo = document.getElementById('filter-condominio');
      condominios.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.nome;
        selectCondo.appendChild(opt);
      });

      const tipos = await getTiposChamado();
      const selectTipo = document.getElementById('filter-tipo');
      tipos.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.nome;
        selectTipo.appendChild(opt);
      });
    }

    async function loadData() {
      showLoader();
      try {
        const filters = {
          search: document.getElementById('filter-search').value.trim(),
          condominio_id: document.getElementById('filter-condominio').value,
          status: document.getElementById('filter-status').value,
          prioridade: document.getElementById('filter-prioridade').value,
          tipo_id: document.getElementById('filter-tipo').value
        };

        chamadosList = await getChamados(filters);
        renderTable(chamadosList);
      } catch (err) {
        showToast('Erro ao carregar chamados', 'error');
      } finally {
        hideLoader();
      }
    }

    function renderTable(list) {
      const tbody = document.getElementById('chamados-tbody');
      if (!list || list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="py-8 text-center text-outline italic">Nenhum chamado encontrado.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(c => `
        <tr class="hover:bg-surface-container-low/60 transition-colors">
          <td class="py-3 px-4 font-poppins font-bold text-primary">#${String(c.numero_sequencial || 0).padStart(4, '0')}</td>
          <td class="py-3 px-4">
            <div class="flex flex-col">
              <span class="font-semibold text-on-surface">${c.titulo}</span>
              <span class="text-xs text-on-surface-variant truncate max-w-xs">${c.descricao || ''}</span>
            </div>
          </td>
          <td class="py-3 px-4">
            <div class="flex flex-col">
              <span class="font-semibold text-xs text-on-surface">${c.condominios?.nome || '-'}</span>
              <span class="text-[11px] text-on-surface-variant">${c.solicitante_unidade || 'Área Comum'}</span>
            </div>
          </td>
          <td class="py-3 px-4 text-xs font-semibold text-on-surface">${c.solicitante_nome}</td>
          <td class="py-3 px-4 text-xs font-semibold text-primary">${c.tipos_chamado?.nome || 'Geral'}</td>
          <td class="py-3 px-4">${priorityBadge(c.prioridade)}</td>
          <td class="py-3 px-4">${statusBadge(c.status)}</td>
          <td class="py-3 px-4 text-right">
            <a href="/chamados/detalhe.html?id=${c.id}" class="inline-flex items-center gap-1 px-3 py-1 rounded bg-surface-container-high hover:bg-primary hover:text-white text-primary text-xs font-bold transition-colors">
              <span>Ver Detalhes</span>
              <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
            </a>
          </td>
        </tr>
      `).join('');
    }

    // Attach Filter Listeners
    ['filter-condominio', 'filter-status', 'filter-prioridade', 'filter-tipo'].forEach(id => {
      document.getElementById(id).addEventListener('change', loadData);
    });

    let debounceTimer;
    document.getElementById('filter-search').addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(loadData, 300);
    });

    document.addEventListener('DOMContentLoaded', async () => {
      await requireAuth();
      await initLayout('chamados', 'Chamados');
      await initFilters();
      loadData();
    });
  </script>
</body>
</html>
