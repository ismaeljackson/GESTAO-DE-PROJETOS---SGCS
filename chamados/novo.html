<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Novo Chamado - SGCS</title>
  <link href="../assets/css/app.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm",
      "alpinejs": "https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/module.esm.js"
    }
  }
  </script>
  <script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "inverse-on-surface": "#eaf1ff", "error-container": "#ffdad6", "primary": "#002451", "secondary": "#346092", "surface-container-highest": "#d3e4fe", "secondary-fixed": "#d2e4ff", "on-secondary": "#ffffff", "on-tertiary-container": "#4caee8", "on-tertiary-fixed-variant": "#004c6e", "surface-container": "#e5eeff", "inverse-surface": "#213145", "on-error": "#ffffff", "secondary-container": "#9cc7fe", "tertiary-fixed": "#c8e6ff", "primary-container": "#0e3a73", "secondary-fixed-dim": "#a1c9ff", "tertiary-container": "#003f5c", "surface-container-lowest": "#ffffff", "surface-variant": "#d3e4fe", "inverse-primary": "#abc7ff", "on-surface-variant": "#434750", "surface-dim": "#cbdbf5", "tertiary-fixed-dim": "#88ceff", "surface-container-low": "#eff4ff", "surface-container-high": "#dce9ff", "on-tertiary-fixed": "#001e2f", "error": "#ba1a1a", "surface-tint": "#3a5e99", "background": "#f8f9ff", "on-background": "#0b1c30", "surface": "#f8f9ff", "primary-fixed": "#d7e3ff", "on-error-container": "#93000a", "primary-fixed-dim": "#abc7ff", "on-surface": "#0b1c30", "on-primary-container": "#83a6e5", "outline": "#737781", "outline-variant": "#c3c6d1", "on-secondary-fixed": "#001c37", "on-tertiary": "#ffffff", "surface-bright": "#f8f9ff", "on-secondary-container": "#245283", "on-primary-fixed-variant": "#1f4680", "on-secondary-fixed-variant": "#164879", "on-primary-fixed": "#001b3f", "on-primary": "#ffffff", "tertiary": "#00283d" } } } };
  </script>
</head>
<body class="bg-background font-body-md text-on-surface antialiased">
  <div id="app-wrapper">
    <main class="flex-1 pl-64 pt-16 w-full">
      <div class="px-gutter-desktop py-space-xl flex flex-col w-full max-w-3xl mx-auto gap-space-lg" x-data="chamadoForm()">

        <div class="flex items-center gap-space-md mb-space-md">
          <button onclick="window.history.back()" class="w-8 h-8 rounded hover:bg-surface-container flex items-center justify-center transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
          </button>
          <h1 class="font-headline-lg text-primary tracking-tight">Novo Chamado</h1>
        </div>

        <form @submit.prevent="save" class="bg-surface-container-lowest p-space-xl rounded shadow-sm border border-outline/20 flex flex-col gap-space-lg">

          <div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
            <div class="flex flex-col gap-space-2xs">
              <label class="font-label-md text-on-surface-variant">Condomínio *</label>
              <select x-model="form.condominio_id" required class="h-10 px-space-sm bg-surface-container-low border border-outline/40 rounded focus:ring-1 focus:ring-primary outline-none cursor-pointer">
                <option value="">Selecione...</option>
                <template x-for="condo in condominios" :key="condo.id">
                  <option :value="condo.id" x-text="condo.nome"></option>
                </template>
              </select>
            </div>

            <div class="flex flex-col gap-space-2xs">
              <label class="font-label-md text-on-surface-variant">Tipo *</label>
              <select x-model="form.tipo_id" required class="h-10 px-space-sm bg-surface-container-low border border-outline/40 rounded focus:ring-1 focus:ring-primary outline-none cursor-pointer">
                <option value="">Selecione...</option>
                <template x-for="tipo in tipos" :key="tipo.id">
                  <option :value="tipo.id" x-text="tipo.nome"></option>
                </template>
              </select>
            </div>
          </div>

          <div class="flex flex-col gap-space-2xs">
            <label class="font-label-md text-on-surface-variant">Prioridade *</label>
            <select x-model="form.prioridade" required class="h-10 px-space-sm bg-surface-container-low border border-outline/40 rounded focus:ring-1 focus:ring-primary outline-none cursor-pointer">
              <option value="baixa">Baixa</option>
              <option value="media">Média</option>
              <option value="alta">Alta</option>
            </select>
          </div>

          <div class="flex flex-col gap-space-2xs">
            <label class="font-label-md text-on-surface-variant">Título *</label>
            <input type="text" x-model="form.titulo" required class="h-10 px-space-sm bg-surface-container-low border border-outline/40 rounded focus:ring-1 focus:ring-primary outline-none">
          </div>

          <div class="flex flex-col gap-space-2xs">
            <label class="font-label-md text-on-surface-variant">Descrição *</label>
            <textarea x-model="form.descricao" required rows="4" class="p-space-sm bg-surface-container-low border border-outline/40 rounded focus:ring-1 focus:ring-primary outline-none resize-none"></textarea>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
            <div class="flex flex-col gap-space-2xs">
              <label class="font-label-md text-on-surface-variant">Solicitante (Nome) *</label>
              <input type="text" x-model="form.solicitante_nome" required class="h-10 px-space-sm bg-surface-container-low border border-outline/40 rounded focus:ring-1 focus:ring-primary outline-none">
            </div>
            <div class="flex flex-col gap-space-2xs">
              <label class="font-label-md text-on-surface-variant">Unidade/Apto</label>
              <input type="text" x-model="form.solicitante_unidade" class="h-10 px-space-sm bg-surface-container-low border border-outline/40 rounded focus:ring-1 focus:ring-primary outline-none">
            </div>
          </div>

          <div class="flex flex-col gap-space-2xs">
            <label class="font-label-md text-on-surface-variant">Anexos</label>
            <input type="file" id="anexos_upload" multiple class="block w-full text-body-sm text-on-surface-variant file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-label-md file:font-semibold file:bg-primary file:text-on-primary hover:file:bg-primary/90">
          </div>

          <div class="flex justify-end gap-space-sm pt-space-md border-t border-outline/10">
            <button type="button" onclick="window.history.back()" class="px-space-md h-10 rounded border border-outline/40 text-on-surface hover:bg-surface-container transition-colors font-label-md">Cancelar</button>
            <button type="submit" :disabled="saving" class="px-space-md h-10 rounded bg-primary text-on-primary hover:bg-primary/90 transition-colors font-label-md flex items-center gap-2">
              <span x-text="saving ? 'Criando...' : 'Criar Chamado'"></span>
            </button>
          </div>
        </form>

      </div>
    </main>
  </div>

  <script type="module">
    import { ui } from '../assets/js/ui.js';
    import { supabase } from '../assets/js/supabase.js';
    import Alpine from 'alpinejs';
    window.Alpine = Alpine;

    document.addEventListener('alpine:init', () => {
      window.Alpine.data('chamadoForm', () => ({
        saving: false,
        condominios: [],
        tipos: [],
        form: {
          titulo: '', descricao: '', prioridade: 'media',
          solicitante_nome: '', solicitante_unidade: '', condominio_id: '',
          tipo_id: ''
        },
        async init() {
          const [{ data: cData }, { data: tData }] = await Promise.all([
             supabase.from('condominios').select('id, nome'),
             supabase.from('tipos_chamado').select('id, nome')
          ]);
          this.condominios = cData || [];
          this.tipos = tData || [];
        },
        async save() {
          this.saving = true;
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const { data: insertData, error: errInsert } = await supabase.from('chamados').insert([{
               condominio_id: this.form.condominio_id,
               tipo_id: this.form.tipo_id,
               titulo: this.form.titulo,
               descricao: this.form.descricao,
               solicitante_nome: this.form.solicitante_nome,
               solicitante_unidade: this.form.solicitante_unidade,
               prioridade: this.form.prioridade,
               status: 'aberto'
            }]).select('id').single();
            if (errInsert) throw errInsert;

            const files = document.getElementById('anexos_upload').files;
            if (files.length > 0 && insertData.id) {
               for (const file of files) {
                  const ext = file.name.split('.').pop();
                  const filename = `chamado-${insertData.id}/${Math.random()}.${ext}`;
                  await supabase.storage.from('chamado-anexos').upload(filename, file);
               }
            }

            await supabase.from('chamado_timeline').insert([{
               chamado_id: insertData.id,
               tipo_evento: 'criacao',
               descricao: 'Chamado criado pelo morador.',
               autor_id: session?.user?.id
            }]);

            window.location.href = 'index.html';
          } catch(e) {
            console.error('Error saving chamado', e);
            alert('Erro ao criar chamado.');
          } finally {
            this.saving = false;
          }
        }
      }));
    });

    Alpine.start();

    document.addEventListener('DOMContentLoaded', async () => {
      await ui.renderLayout('chamados', [{label: 'Chamados', active: false}, {label: 'Novo Chamado', active: true}]);
    });
  </script>
</body>
</html>
