<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Novo Chamado — SGCS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#002451",
            "primary-container": "#0e3a73",
            secondary: "#346092",
            "secondary-container": "#9cc7fe",
            background: "#f8f9ff",
            surface: "#f8f9ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eff4ff",
            "surface-container": "#e5eeff",
            "surface-container-high": "#dce9ff",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#434750",
            outline: "#737781",
            "outline-variant": "#c3c6d1",
            error: "#ba1a1a"
          },
          fontFamily: {
            poppins: ["Poppins", "sans-serif"],
            sans: ["Open Sans", "sans-serif"]
          },
          spacing: {
            'space-xs': '0.5rem',
            'space-sm': '0.75rem',
            'space-md': '1rem',
            'space-lg': '1.25rem',
            'space-xl': '1.5rem',
            'space-2xl': '2rem',
            'margin-desktop': '2rem',
            'gutter-desktop': '1.5rem'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="../assets/css/app.css"/>
</head>
<body class="bg-background font-sans text-on-surface antialiased">

  <div id="app-sidebar"></div>

  <div class="pl-64 flex flex-col min-h-screen">
    <div id="app-header"></div>

    <main class="w-full pt-16 bg-background flex-1 px-gutter-desktop py-space-xl">
      <div class="flex flex-col w-full max-w-4xl mx-auto gap-6">

        <!-- Header -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <a href="./index.html" class="flex items-center text-primary hover:text-secondary font-semibold text-sm">
              <span class="material-symbols-outlined text-[20px]">arrow_back</span>
              <span>Voltar</span>
            </a>
            <h1 class="font-poppins font-bold text-2xl text-primary tracking-tight">Abertura de Novo Chamado</h1>
          </div>
        </div>

        <!-- Form Card -->
        <form id="form-novo-chamado" class="bg-surface-container-lowest p-8 rounded-xl shadow-sm border border-outline-variant/30 flex flex-col gap-6">

          <div class="border-b border-outline-variant/20 pb-4">
            <h2 class="font-poppins font-semibold text-base text-primary">1. Localização e Categoria</h2>
            <p class="text-xs text-on-surface-variant">Selecione o condomínio e a natureza do problema.</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="flex flex-col gap-1.5">
              <label for="select-condominio" class="text-xs font-semibold uppercase tracking-wider text-on-surface">Condomínio *</label>
              <select id="select-condominio" required class="w-full h-10 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 focus:border-secondary cursor-pointer">
                <option value="">Selecione...</option>
              </select>
            </div>

            <div class="flex flex-col gap-1.5">
              <label for="select-tipo" class="text-xs font-semibold uppercase tracking-wider text-on-surface">Tipo de Chamado *</label>
              <select id="select-tipo" required class="w-full h-10 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 focus:border-secondary cursor-pointer">
                <option value="">Selecione...</option>
              </select>
            </div>

            <div class="flex flex-col gap-1.5">
              <label for="select-subtipo" class="text-xs font-semibold uppercase tracking-wider text-on-surface">Subtipo</label>
              <select id="select-subtipo" class="w-full h-10 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 focus:border-secondary cursor-pointer">
                <option value="">Selecione um Tipo primeiro</option>
              </select>
            </div>
          </div>

          <div class="border-b border-outline-variant/20 pb-4 pt-2">
            <h2 class="font-poppins font-semibold text-base text-primary">2. Dados do Solicitante</h2>
            <p class="text-xs text-on-surface-variant">Informações de contato do morador ou colaborador.</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="flex flex-col gap-1.5 md:col-span-2">
              <label for="solicitante-nome" class="text-xs font-semibold uppercase tracking-wider text-on-surface">Nome do Solicitante *</label>
              <input type="text" id="solicitante-nome" required placeholder="Ex: João Silva" class="w-full h-10 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 focus:border-secondary"/>
            </div>

            <div class="flex flex-col gap-1.5">
              <label for="solicitante-unidade" class="text-xs font-semibold uppercase tracking-wider text-on-surface">Unidade / Apto</label>
              <input type="text" id="solicitante-unidade" placeholder="Apto 101 Bloco B" class="w-full h-10 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 focus:border-secondary"/>
            </div>

            <div class="flex flex-col gap-1.5">
              <label for="solicitante-telefone" class="text-xs font-semibold uppercase tracking-wider text-on-surface">Telefone</label>
              <input type="tel" id="solicitante-telefone" placeholder="(11) 99999-9999" class="w-full h-10 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 focus:border-secondary"/>
            </div>
          </div>

          <div class="border-b border-outline-variant/20 pb-4 pt-2">
            <h2 class="font-poppins font-semibold text-base text-primary">3. Detalhamento da Ocorrência</h2>
            <p class="text-xs text-on-surface-variant">Descreva os detalhes e defina a urgência.</p>
          </div>

          <div class="flex flex-col gap-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="flex flex-col gap-1.5 md:col-span-2">
                <label for="chamado-titulo" class="text-xs font-semibold uppercase tracking-wider text-on-surface">Título do Chamado *</label>
                <input type="text" id="chamado-titulo" required placeholder="Resumo do problema (ex: Vazamento na garagem)" class="w-full h-10 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 focus:border-secondary"/>
              </div>

              <div class="flex flex-col gap-1.5">
                <label for="chamado-prioridade" class="text-xs font-semibold uppercase tracking-wider text-on-surface">Prioridade *</label>
                <select id="chamado-prioridade" required class="w-full h-10 px-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 focus:border-secondary cursor-pointer">
                  <option value="baixa">Baixa</option>
                  <option value="media" selected>Média</option>
                  <option value="alta">Alta</option>
                  <option value="urgente">Urgente / Crítica</option>
                </select>
              </div>
            </div>

            <div class="flex flex-col gap-1.5">
              <label for="chamado-descricao" class="text-xs font-semibold uppercase tracking-wider text-on-surface">Descrição Detalhada *</label>
              <textarea id="chamado-descricao" required rows="4" placeholder="Descreva a situação com todos os detalhes necessários..." class="w-full p-3 bg-surface-container-low text-on-surface text-sm rounded outline-none border border-outline-variant/30 focus:border-secondary resize-y"></textarea>
            </div>
          </div>

          <div class="flex items-center justify-end gap-3 pt-4 border-t border-outline-variant/20">
            <a href="./index.html" class="px-5 py-2.5 rounded font-poppins text-sm text-on-surface-variant hover:bg-surface-container-high transition-colors">Cancelar</a>
            <button type="submit" id="btn-submit" class="px-6 py-2.5 rounded font-poppins font-semibold text-sm bg-primary hover:bg-primary-container text-white shadow-sm transition-colors flex items-center gap-2">
              <span class="material-symbols-outlined text-[18px]">send</span>
              <span>Criar Chamado</span>
            </button>
          </div>

        </form>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>

  <script type="module">
    import { requireAuth } from '../assets/js/auth.js';
    import { initLayout } from '../assets/js/layout.js';
    import { showToast, showLoader, hideLoader } from '../assets/js/ui.js';
    import { createChamado } from '../assets/js/chamados-service.js';
    import { getCondominios } from '../assets/js/condominios-service.js';
    import { getTiposChamado, getSubtiposChamado } from '../assets/js/tipos-service.js';

    async function loadFormOptions() {
      showLoader();
      try {
        const condominios = await getCondominios();
        const selectCondo = document.getElementById('select-condominio');
        condominios.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.nome;
          selectCondo.appendChild(opt);
        });

        const tipos = await getTiposChamado();
        const selectTipo = document.getElementById('select-tipo');
        tipos.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.id;
          opt.textContent = t.nome;
          selectTipo.appendChild(opt);
        });
      } catch (err) {
        showToast('Erro ao carregar opções do formulário', 'error');
      } finally {
        hideLoader();
      }
    }

    document.getElementById('select-tipo').addEventListener('change', async (e) => {
      const tipoId = e.target.value;
      const selectSubtipo = document.getElementById('select-subtipo');
      selectSubtipo.innerHTML = '<option value="">Selecione...</option>';

      if (!tipoId) return;

      try {
        const subtipos = await getSubtiposChamado(tipoId);
        subtipos.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = s.nome;
          selectSubtipo.appendChild(opt);
        });
      } catch (err) {
        console.error('Erro ao buscar subtipos:', err);
      }
    });

    document.getElementById('form-novo-chamado').addEventListener('submit', async (e) => {
      e.preventDefault();

      const condominio_id = document.getElementById('select-condominio').value;
      const tipo_id = document.getElementById('select-tipo').value;
      const subtipo_id = document.getElementById('select-subtipo').value || null;

      const solicitante_nome = document.getElementById('solicitante-nome').value.trim();
      const solicitante_unidade = document.getElementById('solicitante-unidade').value.trim();
      const solicitante_telefone = document.getElementById('solicitante-telefone').value.trim();

      const titulo = document.getElementById('chamado-titulo').value.trim();
      const prioridade = document.getElementById('chamado-prioridade').value;
      const descricao = document.getElementById('chamado-descricao').value.trim();

      if (!condominio_id || !tipo_id || !solicitante_nome || !titulo || !descricao) {
        showToast('Preencha os campos obrigatórios (*)', 'error');
        return;
      }

      const payload = {
        condominio_id,
        tipo_id,
        subtipo_id,
        solicitante_nome,
        solicitante_unidade,
        solicitante_telefone,
        titulo,
        prioridade,
        descricao,
        status: 'aberto'
      };

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;

      try {
        const criado = await createChamado(payload);
        showToast('Chamado criado com sucesso!');
        setTimeout(() => {
          window.location.href = `./detalhe.html?id=${criado.id}`;
        }, 800);
      } catch (err) {
        showToast(err.message || 'Erro ao criar chamado', 'error');
        btn.disabled = false;
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      await requireAuth();
      await initLayout('chamados', 'Novo Chamado');
      await loadFormOptions();
    });
  </script>
</body>
</html>
