<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Detalhe do Chamado - SGCS</title>
  <link href="../assets/css/app.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm",
      "alpinejs": "https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/module.esm.js"
    }
  }
  </script>
  <script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "inverse-on-surface": "#eaf1ff", "error-container": "#ffdad6", "primary": "#002451", "secondary": "#346092", "surface-container-highest": "#d3e4fe", "secondary-fixed": "#d2e4ff", "on-secondary": "#ffffff", "on-tertiary-container": "#4caee8", "on-tertiary-fixed-variant": "#004c6e", "surface-container": "#e5eeff", "inverse-surface": "#213145", "on-error": "#ffffff", "secondary-container": "#9cc7fe", "tertiary-fixed": "#c8e6ff", "primary-container": "#0e3a73", "secondary-fixed-dim": "#a1c9ff", "tertiary-container": "#003f5c", "surface-container-lowest": "#ffffff", "surface-variant": "#d3e4fe", "inverse-primary": "#abc7ff", "on-surface-variant": "#434750", "surface-dim": "#cbdbf5", "tertiary-fixed-dim": "#88ceff", "surface-container-low": "#eff4ff", "surface-container-high": "#dce9ff", "on-tertiary-fixed": "#001e2f", "error": "#ba1a1a", "surface-tint": "#3a5e99", "background": "#f8f9ff", "on-background": "#0b1c30", "surface": "#f8f9ff", "primary-fixed": "#d7e3ff", "on-error-container": "#93000a", "primary-fixed-dim": "#abc7ff", "on-surface": "#0b1c30", "on-primary-container": "#83a6e5", "outline": "#737781", "outline-variant": "#c3c6d1", "on-secondary-fixed": "#001c37", "on-tertiary": "#ffffff", "surface-bright": "#f8f9ff", "on-secondary-container": "#245283", "on-primary-fixed-variant": "#1f4680", "on-secondary-fixed-variant": "#164879", "on-primary-fixed": "#001b3f", "on-primary": "#ffffff", "tertiary": "#00283d" } } } };
  </script>
</head>
<body class="bg-background font-body-md text-on-surface antialiased">
  <div id="app-wrapper">
    <main class="flex-1 pl-64 pt-16 w-full">
      <div class="px-gutter-desktop py-space-xl flex flex-col w-full gap-space-lg" x-data="chamadoDetalhe()">

        <template x-if="loading">
          <div class="text-center p-space-xl">Carregando...</div>
        </template>

        <template x-if="!loading && chamado">
          <div class="flex flex-col gap-space-lg">

            <div class="flex flex-wrap items-center justify-between gap-space-md bg-surface-container-lowest p-space-md rounded shadow-sm">
              <div class="flex items-center gap-space-md">
                <a class="flex items-center gap-space-xs text-primary hover:text-secondary transition-colors font-label-md" href="index.html">
                  <i data-lucide="arrow-left" class="w-4 h-4"></i>
                  <span>Voltar</span>
                </a>
                <div class="w-1 h-1 rounded-full bg-outline-variant"></div>
                <div class="flex items-center gap-space-2xs text-on-surface-variant font-label-sm uppercase tracking-wider">
                  <span>Protocolo <strong x-text="'#' + String(chamado.numero_sequencial).padStart(4, '0')"></strong></span>
                </div>
              </div>
              <div class="flex items-center gap-space-xs">
                <span class="inline-flex items-center gap-1.5 px-space-xs py-0.5 rounded font-label-sm bg-surface-variant text-on-surface-variant uppercase tracking-wider font-bold" x-text="chamado.status"></span>
                <span class="inline-flex items-center gap-1.5 px-space-xs py-0.5 rounded font-label-sm uppercase tracking-wider font-bold"
                      :class="chamado.prioridade === 'alta' ? 'bg-error-container text-on-error-container' : 'bg-secondary-container text-on-secondary-container'"
                      x-text="'PRIORIDADE ' + chamado.prioridade">
                </span>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-space-lg items-start">

              <div class="lg:col-span-8 flex flex-col gap-space-lg">
                <div class="bg-surface-container-lowest p-space-lg rounded shadow-sm border border-outline/20 flex flex-col gap-space-md">
                  <h1 class="font-headline-lg text-primary tracking-tight" x-text="chamado.titulo"></h1>
                  <p class="font-body-md text-on-surface" x-text="chamado.descricao"></p>

                  <div class="p-space-sm bg-surface-container-low rounded border border-outline/10 flex flex-wrap gap-space-lg mt-space-sm">
                    <div class="flex flex-col gap-1">
                      <span class="font-label-sm text-on-surface-variant uppercase tracking-wider">Solicitante</span>
                      <span class="font-body-sm font-semibold text-on-surface" x-text="chamado.solicitante_nome"></span>
                    </div>
                    <div class="flex flex-col gap-1">
                      <span class="font-label-sm text-on-surface-variant uppercase tracking-wider">Unidade</span>
                      <span class="font-body-sm font-semibold text-on-surface" x-text="chamado.solicitante_unidade"></span>
                    </div>
                  </div>
                </div>

                <div class="bg-surface-container-lowest rounded shadow-sm border border-outline/20 p-space-lg flex flex-col gap-space-md">
                  <h2 class="font-headline-sm text-primary mb-space-sm">Histórico e Atualizações</h2>

                  <div class="flex flex-col gap-space-md pl-space-sm border-l-2 border-surface-variant ml-space-sm">
                    <template x-for="evento in timeline" :key="evento.id">
                      <div class="relative pl-space-md">
                        <div class="absolute -left-[27px] top-1 w-6 h-6 rounded-full flex items-center justify-center border-2 border-surface-container-lowest"
                             :class="evento.tipo_evento === 'comentario' ? 'bg-secondary text-white' : 'bg-surface-variant text-on-surface-variant'">
                          <i :data-lucide="evento.tipo_evento === 'comentario' ? 'message-square' : 'clock'" class="w-3 h-3"></i>
                        </div>
                        <div class="flex flex-col bg-surface-container-low p-space-sm rounded">
                          <div class="flex justify-between items-center mb-1">
                            <span class="font-label-sm font-bold text-on-surface" x-text="evento.profiles ? evento.profiles.nome_completo : 'Sistema'"></span>
                            <span class="font-label-sm text-on-surface-variant" x-text="formatDate(evento.created_at)"></span>
                          </div>
                          <p class="font-body-sm text-on-surface" x-text="evento.descricao"></p>
                        </div>
                      </div>
                    </template>
                  </div>

                  <form @submit.prevent="addComentario" class="mt-space-md border-t border-outline/20 pt-space-md flex flex-col gap-space-sm">
                    <textarea x-model="novoComentario" rows="3" placeholder="Adicionar uma atualização ou comentário..." class="w-full p-space-sm bg-surface-container-lowest border border-outline/40 rounded focus:ring-1 focus:ring-primary outline-none resize-none" required></textarea>

                    <div class="flex justify-between items-center">
                      <div class="flex items-center gap-space-xs text-primary cursor-pointer hover:underline font-label-sm">
                        <i data-lucide="paperclip" class="w-4 h-4"></i>
                        <input type="file" id="anexoFile" class="hidden">
                        <label for="anexoFile" class="cursor-pointer">Anexar arquivo</label>
                      </div>
                      <button type="submit" :disabled="!novoComentario" class="px-space-md h-9 rounded bg-primary text-on-primary font-label-md hover:bg-primary/90 transition-colors disabled:opacity-50">Enviar</button>
                    </div>
                  </form>
                </div>
              </div>

              <div class="lg:col-span-4 flex flex-col gap-space-md">
                <div class="bg-surface-container-lowest p-space-md rounded shadow-sm border border-outline/20 flex flex-col gap-space-sm">
                  <h3 class="font-label-md font-bold text-on-surface border-b border-outline/10 pb-space-xs">Ações Rápidas</h3>

                  <div class="flex flex-col gap-space-2xs mt-space-xs">
                    <label class="font-label-sm text-on-surface-variant uppercase">Alterar Status</label>
                    <select x-model="chamado.status" @change="updateStatus" class="h-9 px-space-xs bg-surface-container-low border border-outline/20 rounded font-body-sm outline-none cursor-pointer">
                      <option value="aberto">Aberto</option>
                      <option value="em andamento">Em Andamento</option>
                      <option value="aguardando">Aguardando</option>
                      <option value="resolvido">Resolvido</option>
                    </select>
                  </div>

                  <div class="flex flex-col gap-space-2xs">
                    <label class="font-label-sm text-on-surface-variant uppercase">Prioridade</label>
                    <select x-model="chamado.prioridade" @change="updatePrioridade" class="h-9 px-space-xs bg-surface-container-low border border-outline/20 rounded font-body-sm outline-none cursor-pointer">
                      <option value="baixa">Baixa</option>
                      <option value="media">Média</option>
                      <option value="alta">Alta</option>
                    </select>
                  </div>
                </div>

                <div class="bg-surface-container-lowest p-space-md rounded shadow-sm border border-outline/20 flex flex-col gap-space-sm">
                  <h3 class="font-label-md font-bold text-on-surface border-b border-outline/10 pb-space-xs">Detalhes</h3>
                  <div class="flex flex-col gap-2 mt-1">
                    <div class="flex justify-between font-body-sm">
                      <span class="text-on-surface-variant">Abertura:</span>
                      <span class="font-semibold text-on-surface" x-text="formatDate(chamado.created_at)"></span>
                    </div>
                    <div class="flex justify-between font-body-sm">
                      <span class="text-on-surface-variant">Condomínio:</span>
                      <span class="font-semibold text-primary" x-text="chamado.condominios ? chamado.condominios.nome : 'N/A'"></span>
                    </div>
                    <div class="flex justify-between font-body-sm">
                      <span class="text-on-surface-variant">Tipo:</span>
                      <span class="font-semibold text-on-surface" x-text="chamado.tipos_chamado ? chamado.tipos_chamado.nome : 'N/A'"></span>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </template>
      </div>
    </main>
  </div>

  <script type="module">
    import { ui } from '../assets/js/ui.js';
    import { supabase } from '../assets/js/supabase.js';
    import { format } from 'https://esm.sh/date-fns';
    import Alpine from 'alpinejs';
    window.Alpine = Alpine;

    document.addEventListener('alpine:init', () => {
      window.Alpine.data('chamadoDetalhe', () => ({
        loading: true,
        chamado: null,
        timeline: [],
        novoComentario: '',

        async init() {
          const urlParams = new URLSearchParams(window.location.search);
          const id = urlParams.get('id');
          if (!id) return window.location.href = 'index.html';

          try {
            const { data: cData, error: cErr } = await supabase
              .from('chamados')
              .select('*, condominios(nome), tipos_chamado(nome)')
              .eq('id', id)
              .single();
            if (cErr) throw cErr;
            this.chamado = cData;

            const { data: tData, error: tErr } = await supabase
              .from('chamado_timeline')
              .select('*, profiles(nome_completo)')
              .eq('chamado_id', id)
              .order('created_at', { ascending: false });
            if (tErr) throw tErr;
            this.timeline = tData || [];
          } catch(e) {
            console.error(e);
          } finally {
            this.loading = false;
            setTimeout(() => { if(window.lucide) window.lucide.createIcons(); }, 50);
          }
        },

        formatDate(dateStr) {
          if (!dateStr) return '';
          try {
            const date = new Date(dateStr);
            return format(date, "dd/MM/yyyy 'às' HH:mm");
          } catch(e) { return dateStr; }
        },

        async updateStatus() {
          try {
             await supabase.from('chamados').update({status: this.chamado.status}).eq('id', this.chamado.id);
             const { data: { session } } = await supabase.auth.getSession();
             await supabase.from('chamado_timeline').insert([{
               chamado_id: this.chamado.id,
               tipo_evento: 'status_alterado',
               descricao: `Status alterado para ${this.chamado.status}`,
               autor_id: session?.user?.id
             }]);
             this.init();
          } catch (e) { console.error(e); }
        },

        async updatePrioridade() {
          try {
             await supabase.from('chamados').update({prioridade: this.chamado.prioridade}).eq('id', this.chamado.id);
          } catch (e) { console.error(e); }
        },

        async addComentario() {
          if (!this.novoComentario.trim()) return;
          try {
            const { data: { session } } = await supabase.auth.getSession();

            // Handle file upload if any
            const fileInput = document.getElementById('anexoFile');
            const file = fileInput.files[0];
            let msgAdicional = '';

            if (file) {
               const ext = file.name.split('.').pop();
               const filename = `chamado-${this.chamado.id}/${Math.random()}.${ext}`;
               const { error: uploadError } = await supabase.storage.from('chamado-anexos').upload(filename, file);
               if (!uploadError) {
                  msgAdicional = ` (Arquivo anexado: ${file.name})`;
               }
            }

            await supabase.from('chamado_timeline').insert([{
               chamado_id: this.chamado.id,
               tipo_evento: 'comentario',
               descricao: this.novoComentario + msgAdicional,
               autor_id: session?.user?.id
            }]);

            this.novoComentario = '';
            fileInput.value = '';
            this.init();
          } catch(e) { console.error(e); }
        }
      }));
    });

    Alpine.start();

    document.addEventListener('DOMContentLoaded', async () => {
      await ui.renderLayout('chamados', [{label: 'Chamados', active: false}, {label: 'Detalhes', active: true}], '../' );
    });
  </script>
</body>
</html>
