<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Cadastrar - SGCS</title>
  <link href="assets/css/app.css" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm",
      "alpinejs": "https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/module.esm.js"
    }
  }
  </script>

  <script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "inverse-on-surface": "#eaf1ff", "error-container": "#ffdad6", "primary": "#002451", "secondary": "#346092", "surface-container-highest": "#d3e4fe", "secondary-fixed": "#d2e4ff", "on-secondary": "#ffffff", "on-tertiary-container": "#4caee8", "on-tertiary-fixed-variant": "#004c6e", "surface-container": "#e5eeff", "inverse-surface": "#213145", "on-error": "#ffffff", "secondary-container": "#9cc7fe", "tertiary-fixed": "#c8e6ff", "primary-container": "#0e3a73", "secondary-fixed-dim": "#a1c9ff", "tertiary-container": "#003f5c", "surface-container-lowest": "#ffffff", "surface-variant": "#d3e4fe", "inverse-primary": "#abc7ff", "on-surface-variant": "#434750", "surface-dim": "#cbdbf5", "tertiary-fixed-dim": "#88ceff", "surface-container-low": "#eff4ff", "surface-container-high": "#dce9ff", "on-tertiary-fixed": "#001e2f", "error": "#ba1a1a", "surface-tint": "#3a5e99", "background": "#f8f9ff", "on-background": "#0b1c30", "surface": "#f8f9ff", "primary-fixed": "#d7e3ff", "on-error-container": "#93000a", "primary-fixed-dim": "#abc7ff", "on-surface": "#0b1c30", "on-primary-container": "#83a6e5", "outline": "#737781", "outline-variant": "#c3c6d1", "on-secondary-fixed": "#001c37", "on-tertiary": "#ffffff", "surface-bright": "#f8f9ff", "on-secondary-container": "#245283", "on-primary-fixed-variant": "#1f4680", "on-secondary-fixed-variant": "#164879", "on-primary-fixed": "#001b3f", "on-primary": "#ffffff", "tertiary": "#00283d" }, "spacing": { "space-md": "1rem", "space-xs": "0.5rem", "space-2xs": "0.25rem", "space-xl": "1.5rem" } } } };
  </script>

  <script type="module">
    import { auth } from './assets/js/auth.js';
    import Alpine from 'alpinejs';
    window.Alpine = Alpine;

    window.registerForm = () => ({
        nome_completo: '', email: '', password: '', role: 'admin', loading: false, error: null,
        async submit() {
          this.loading = true; this.error = null;
          try {
            const userData = { nome_completo: this.nome_completo, role: this.role };
            const { error } = await auth.register(this.email, this.password, userData);
            if (error) throw error;
            alert("Cadastro realizado! Por favor faça o login.");
            window.location.href = 'index.html';
          } catch (err) {
            this.error = err.message || 'Erro ao realizar cadastro.';
          } finally {
            this.loading = false;
          }
        }
    });

    Alpine.start();
    document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
  </script>
</head>
<body class="bg-surface-container-lowest font-body-md text-on-surface antialiased flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md p-space-xl bg-surface-container-lowest shadow-sm border border-outline/20 rounded" x-data="registerForm()">
    <div class="flex flex-col items-center mb-space-xl">
      <div class="flex flex-col items-center text-center">
        <span class="font-display-lg text-display-lg tracking-tight text-primary leading-none mb-space-2xs">SGCS</span>
        <span class="font-label-md text-label-md text-secondary tracking-wider uppercase">Gestão Predial</span>
      </div>
      <h1 class="font-headline-sm text-headline-sm text-on-surface mt-space-md">Crie uma conta de Administrador</h1>
    </div>

    <form @submit.prevent="submit" class="flex flex-col gap-space-md">
      <div x-show="error" class="bg-error-container text-on-error-container p-space-sm rounded font-body-sm text-body-sm flex items-center gap-space-xs" style="display: none;">
        <i data-lucide="alert-circle" class="w-4 h-4"></i>
        <span x-text="error"></span>
      </div>

      <div class="flex flex-col gap-space-2xs">
        <label for="nome" class="font-label-md text-label-md text-on-surface-variant">Nome Completo</label>
        <input type="text" id="nome" x-model="nome_completo" required class="w-full h-10 px-space-sm bg-surface-container-low text-on-surface border border-outline/40 rounded focus:outline-none focus:ring-1 focus:ring-primary font-body-md text-body-md" placeholder="Nome Sobrenome">
      </div>

      <div class="flex flex-col gap-space-2xs">
        <label for="email" class="font-label-md text-label-md text-on-surface-variant">E-mail</label>
        <input type="email" id="email" x-model="email" required class="w-full h-10 px-space-sm bg-surface-container-low text-on-surface border border-outline/40 rounded focus:outline-none focus:ring-1 focus:ring-primary font-body-md text-body-md" placeholder="seu@email.com">
      </div>

      <div class="flex flex-col gap-space-2xs">
        <label for="password" class="font-label-md text-label-md text-on-surface-variant">Senha</label>
        <input type="password" id="password" x-model="password" required class="w-full h-10 px-space-sm bg-surface-container-low text-on-surface border border-outline/40 rounded focus:outline-none focus:ring-1 focus:ring-primary font-body-md text-body-md" placeholder="••••••••">
      </div>

      <button type="submit" :disabled="loading" class="mt-space-xs w-full h-10 bg-primary text-on-primary font-label-md text-label-md rounded shadow-sm hover:bg-primary/90 transition-colors flex items-center justify-center gap-space-xs disabled:opacity-50">
        <span x-show="!loading">Cadastrar</span>
        <i x-show="loading" data-lucide="loader-2" class="w-4 h-4 animate-spin" style="display: none;"></i>
      </button>
      <a href="index.html" class="text-center font-label-sm mt-space-sm hover:underline">Já tenho uma conta</a>
    </form>
  </div>
</body>
</html>
